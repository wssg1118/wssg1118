name: Update Contribution Heatmap
run-name: Refresh heatmap
permissions:
  contents: write
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 这里不要传你的 PAT！内置 GITHUB_TOKEN 自动生效

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run heatmap script
        run: node scripts/contrib-heatmap.mjs

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$PWD"
          git add assets/contrib-heatmap.svg assets/contrib-data.json
          git commit --allow-empty -m "auto: update heatmap"
          git push
